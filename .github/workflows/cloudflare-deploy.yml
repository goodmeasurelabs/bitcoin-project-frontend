name: Deploy Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect existing Worker metadata or deploy current main
        type: choice
        options: [inspect, deploy]
        default: inspect
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_SANITIZE: 'true'
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read only the existing Worker metadata; never deploy or query D1
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node cloudflare/release-state.mjs --inspect
      - name: Retain sanitized inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitcoin-worker-inspection-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 30
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx --no-install opennextjs-cloudflare build
      - run: npx --no-install wrangler deploy --config wrangler.ci.jsonc --keep-vars --message="GitHub commit ${{ github.sha }}" --dry-run --outdir .worker-dry-run
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx --no-install opennextjs-cloudflare build
      - name: Require the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_sha" = "$GITHUB_SHA"
      - name: Require approved deployment credential
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: test -n "$DEPLOY_TOKEN"
      - name: Capture existing Worker/D1-binding/environment/schedule metadata
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node cloudflare/release-state.mjs
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ee641897681cddb2b23b18fb4b639034
          wranglerVersion: '4.158.0'
          command: deploy --config wrangler.ci.jsonc --keep-vars --message="GitHub commit ${{ github.sha }}"
      - name: Verify exact source and preserved bindings/environment/schedules
        env:
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node cloudflare/release-state.mjs --after
      - name: Retain sanitized before/after release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitcoin-worker-release-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify live homepage
        run: curl --fail --silent --show-error --retry 3 https://whatsbitcoinsprice.com/ --output /dev/null
